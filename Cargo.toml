[package]
name = "imdbcopy"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = "1.0.228"
rocket_okapi = { version = "0.9.0", features = ["swagger", "rapidoc"] }
dashmap = "6.1.0"
rayon = "1.11.0"

[dependencies.rocket]
version = "=0.5.1"
features = ["json"]

[dependencies.rocket_db_pools]
version = "=0.2.0"
features = ["sqlx_postgres"]
